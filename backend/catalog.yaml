- id: mongo-express
  name: MongoDB + Mongo Express
  category: Databases
  icon: mongodb
  website: https://www.mongodb.com
  tagline: MongoDB with a web admin
  description: A MongoDB 8 database with Mongo Express to browse collections. The database stays private.
  public: { service: mongo-express, port: 8081 }
  auth: login
  inputs:
    - { key: MONGO_PASSWORD, label: Database password (user "root"), generate: password, secret: true }
    - { key: ME_PASSWORD, label: Mongo Express password (user "admin"), generate: password, secret: true }
  compose: |
    services:
      mongo:
        image: mongo:8
        restart: unless-stopped
        environment:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
        volumes:
          - data:/data/db
      mongo-express:
        image: mongo-express:latest
        restart: unless-stopped
        depends_on:
          - mongo
        environment:
          ME_CONFIG_MONGODB_URL: mongodb://root:${MONGO_PASSWORD}@mongo:27017/
          ME_CONFIG_BASICAUTH_USERNAME: admin
          ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD}
    volumes:
      data:

