  auth_note: "No login. Anyone with the URL can see your dashboard and its links."
  inputs: []
  compose: |
    services:
      homepage:
        image: ghcr.io/gethomepage/homepage:latest
        restart: unless-stopped
        environment:
          HOMEPAGE_ALLOWED_HOSTS: ${INSTA_PUBLIC_HOST}
        volumes:
          - config:/app/config
    volumes:
      config:

- id: code-server
  name: VS Code (code-server)
  category: Development
  icon: visual-studio-code
  website: https://coder.com/docs/code-server
  tagline: VS Code in your browser
  description: A full VS Code editor running on your machine, reachable from any browser.
  public: { service: code-server, port: 8443 }
  auth: login
  auth_note: "Protected by the password above. It's a full terminal on the container, so keep the password strong."
  inputs:
    - { key: PASSWORD, label: Password, generate: password, secret: true }
    - { key: TZ, label: Time zone, default: "{tz}" }
  compose: |
    services:
      code-server:
        image: lscr.io/linuxserver/code-server:latest
        restart: unless-stopped
        environment:
          PUID: "1000"
          PGID: "1000"
          TZ: ${TZ}
          PASSWORD: ${PASSWORD}
        volumes:
          - config:/config
    volumes:
      config:

- id: umami
  name: Umami
  category: Analytics
  icon: umami
  website: https://umami.is
  tagline: Simple, privacy-friendly web analytics
  description: A Google Analytics alternative without cookies. Runs with PostgreSQL.
  public: { service: umami, port: 3000 }
  auth: setup
  auth_note: "It starts with a default login (admin / umami) that anyone can look up. Change it right after deploying."
  inputs:
    - { key: DB_PASSWORD, generate: password, secret: true, hidden: true }
    - { key: APP_SECRET, generate: secret, secret: true, hidden: true }
  notes: "Default login: admin / umami (change it right away)."
  compose: |
    services:
      db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
          POSTGRES_DB: umami
          POSTGRES_USER: umami
          POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
          - pgdata:/var/lib/postgresql/data
      umami:
        image: ghcr.io/umami-software/umami:postgresql-latest
        restart: unless-stopped
        depends_on:
          - db
        environment:
          DATABASE_URL: postgresql://umami:${DB_PASSWORD}@db:5432/umami
          APP_SECRET: ${APP_SECRET}
    volumes:
      pgdata:

- id: photoprism
  name: PhotoPrism
  category: Photos & Media
  icon: photoprism
  website: https://www.photoprism.app
  tagline: AI-powered photo library
  description: Browse, organize and share your photo collection with automatic tagging and maps. Runs with MariaDB.
  public: { service: photoprism, port: 2342 }
  auth: login
  inputs:
    - { key: PHOTOPRISM_ADMIN_PASSWORD, label: Admin password (user "admin"), generate: password, secret: true }
    - { key: DB_PASSWORD, generate: password, secret: true, hidden: true }
  compose: |
    services:
      mariadb:
        image: mariadb:11
        restart: unless-stopped
        command: --innodb-buffer-pool-size=512M --transaction-isolation=READ-COMMITTED --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        environment:
          MARIADB_DATABASE: photoprism
          MARIADB_USER: photoprism
          MARIADB_PASSWORD: ${DB_PASSWORD}
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
        volumes:
          - db:/var/lib/mysql
      photoprism:
        image: photoprism/photoprism:latest
        restart: unless-stopped
        depends_on:
          - mariadb
        environment:
          PHOTOPRISM_ADMIN_USER: admin
          PHOTOPRISM_ADMIN_PASSWORD: ${PHOTOPRISM_ADMIN_PASSWORD}
          PHOTOPRISM_SITE_URL: ${INSTA_PUBLIC_URL}/
          PHOTOPRISM_DATABASE_DRIVER: mysql
          PHOTOPRISM_DATABASE_SERVER: mariadb:3306
          PHOTOPRISM_DATABASE_NAME: photoprism
          PHOTOPRISM_DATABASE_USER: photoprism
          PHOTOPRISM_DATABASE_PASSWORD: ${DB_PASSWORD}
        volumes:
          - originals:/photoprism/originals
          - storage:/photoprism/storage
    volumes:
      db:
      originals:
      storage:

- id: kavita
  name: Kavita
  category: Photos & Media
  icon: kavita
  website: https://www.kavitareader.com
  tagline: Reader for manga, comics and books
  description: Read and organize ebooks, comics and manga in the browser. Put your library in the "library" volume.
  public: { service: kavita, port: 5000 }
