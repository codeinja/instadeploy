- id: open-webui
  name: Open WebUI + Ollama
  category: AI
  icon: open-webui
  website: https://openwebui.com
  tagline: ChatGPT-style interface for local AI models
  description: >
    Chat with open models (Llama, Mistral, Gemma…) running on your own
    machine through Ollama. Runs on CPU; pull models from the admin
    settings. Needs plenty of RAM for larger models.
  public: { service: open-webui, port: 8080 }
  auth: setup
  auth_note: "The first account to sign up becomes the admin."
  inputs:
    - { key: WEBUI_SECRET_KEY, generate: secret, secret: true, hidden: true }
  notes: Create your admin account the first time you open it.
  compose: |
    services:
      ollama:
        image: ollama/ollama:latest
        restart: unless-stopped
        volumes:
          - ollama:/root/.ollama
      open-webui:
        image: ghcr.io/open-webui/open-webui:main
        restart: unless-stopped
        depends_on:
          - ollama
        environment:
          OLLAMA_BASE_URL: http://ollama:11434
          WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
        volumes:
          - open-webui:/app/backend/data
    volumes:
      ollama:
      open-webui:

- id: gitea
  name: Gitea
  category: Development
  icon: gitea
  website: https://about.gitea.com
  tagline: Lightweight Git hosting
  description: >
    Host Git repositories with issues, pull requests, CI (Actions) and a
    package registry. Runs with PostgreSQL. Cloning works over HTTPS.
  public: { service: gitea, port: 3000 }
  auth: setup
  auth_note: "The first visitor completes the installation page and can create the admin account."
  inputs:
    - { key: DB_PASSWORD, generate: password, secret: true, hidden: true }
  notes: Finish the installation page on first visit (the database is already set up).
  compose: |
    services:
      db:
        image: postgres:17
        restart: unless-stopped
        environment:
          POSTGRES_USER: gitea
          POSTGRES_PASSWORD: ${DB_PASSWORD}
          POSTGRES_DB: gitea
        volumes:
          - pgdata:/var/lib/postgresql/data
      gitea:
        image: gitea/gitea:latest
        restart: unless-stopped
        depends_on:
          - db
        environment:
          USER_UID: "1000"
          USER_GID: "1000"
          GITEA__database__DB_TYPE: postgres
          GITEA__database__HOST: db:5432
          GITEA__database__NAME: gitea
          GITEA__database__USER: gitea
          GITEA__database__PASSWD: ${DB_PASSWORD}
          GITEA__server__DOMAIN: ${INSTA_PUBLIC_HOST}
          GITEA__server__ROOT_URL: ${INSTA_PUBLIC_URL}/
        volumes:
          - data:/data
    volumes:
      pgdata:
      data:

