# ------------------------------------------------------------ utilities

- id: postgres-adminer
  name: PostgreSQL + Adminer
  category: Databases
  icon: postgresql
  website: https://www.postgresql.org
  tagline: PostgreSQL database with a web admin
  description: >
    A PostgreSQL 17 database with Adminer to browse and edit it in the
    browser. The database itself stays private.
  public: { service: adminer, port: 8080 }
  auth: login
  auth_note: "Adminer asks for the database username and password."
  inputs:
    - { key: POSTGRES_USER, label: Database user, default: postgres }
    - { key: POSTGRES_PASSWORD, label: Database password, generate: password, secret: true }
    - { key: POSTGRES_DB, label: Database name, default: app }
  notes: In Adminer, choose PostgreSQL and use server "db".
  compose: |
    services:
      db:
        image: postgres:17
        restart: unless-stopped
        environment:
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          POSTGRES_DB: ${POSTGRES_DB}
        volumes:
          - pgdata:/var/lib/postgresql/data
      adminer:
        image: adminer:latest
        restart: unless-stopped
        environment:
          ADMINER_DEFAULT_SERVER: db
    volumes:
      pgdata:

- id: mariadb-adminer
  name: MariaDB + Adminer
  category: Databases
  icon: mariadb
  website: https://mariadb.org
  tagline: MySQL-compatible database with a web admin
  description: A MariaDB 11 database with Adminer to browse and edit it. The database stays private.
  public: { service: adminer, port: 8080 }
  auth: login
  auth_note: "Adminer asks for the database username and password."
  inputs:
    - { key: MARIADB_USER, label: Database user, default: app }
    - { key: MARIADB_PASSWORD, label: Database password, generate: password, secret: true }
    - { key: MARIADB_DATABASE, label: Database name, default: app }
    - { key: MARIADB_ROOT_PASSWORD, generate: password, secret: true, hidden: true }
  notes: In Adminer, use server "db".
  compose: |
    services:
      db:
        image: mariadb:11
        restart: unless-stopped
        environment:
          MARIADB_USER: ${MARIADB_USER}
          MARIADB_PASSWORD: ${MARIADB_PASSWORD}
          MARIADB_DATABASE: ${MARIADB_DATABASE}
          MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
        volumes:
          - db:/var/lib/mysql
      adminer:
        image: adminer:latest
        restart: unless-stopped
        environment:
          ADMINER_DEFAULT_SERVER: db
    volumes:
