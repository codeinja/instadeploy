- id: ghost
  name: Ghost
  category: Websites
  icon: ghost
  website: https://ghost.org
  tagline: Publishing platform for blogs and newsletters
  description: Write, publish and send newsletters with a clean editor. Runs with MySQL.
  public: { service: ghost, port: 2368 }
  auth: setup
  auth_note: "The site is meant to be public; the admin area (/ghost) is claimed by whoever creates the first account."
  inputs:
    - { key: DB_PASSWORD, generate: password, secret: true, hidden: true }
  notes: Open /ghost on your site to create the admin account.
  compose: |
    services:
      db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
          MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
          MYSQL_DATABASE: ghost
        volumes:
          - db:/var/lib/mysql
      ghost:
        image: ghost:5-alpine
        restart: unless-stopped
        depends_on:
          - db
        environment:
          url: ${INSTA_PUBLIC_URL}
          database__client: mysql
          database__connection__host: db
          database__connection__user: root
          database__connection__password: ${DB_PASSWORD}
          database__connection__database: ghost
        volumes:
          - content:/var/lib/ghost/content
    volumes:
      db:
      content:

- id: wordpress
  name: WordPress
  category: Websites
  icon: wordpress
  website: https://wordpress.org
  tagline: The world's most popular website builder
  description: Blogs, business sites and online shops with thousands of themes and plugins. Runs with MariaDB.
  public: { service: wordpress, port: 80 }
  auth: setup
  auth_note: "The first visitor chooses the site title and admin account."
  inputs:
    - { key: DB_PASSWORD, generate: password, secret: true, hidden: true }
  notes: Choose your site title and admin account on first visit.
  compose: |
    services:
      db:
        image: mariadb:11
        restart: unless-stopped
        environment:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: ${DB_PASSWORD}
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
        volumes:
          - db:/var/lib/mysql
      wordpress:
        image: wordpress:latest
        restart: unless-stopped
        depends_on:
          - db
        environment:
          WORDPRESS_DB_HOST: db
          WORDPRESS_DB_USER: wordpress
          WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
          WORDPRESS_DB_NAME: wordpress
          # Behind Pangolin the site is served over HTTPS.
          WORDPRESS_CONFIG_EXTRA: |
            if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        volumes:
          - wordpress:/var/www/html
    volumes:
      db:
      wordpress:

